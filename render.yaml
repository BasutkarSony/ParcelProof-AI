services:
  - type: web
    name: parcelproof-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PARCELPROOF_REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: SUPABASE_URL
        value: https://tsdxskfgpvykjuhrjvve.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: inspection-photos
      - key: FRONTEND_URL
        fromService:
          name: parcelproof-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PARCELPROOF_DEMO_AUTH_REQUIRED
        value: "false"
      - key: PAYPAL_TRACKING_SUBMISSION_ENABLED
        value: "false"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PACKING_VISION_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_VISION_TIMEOUT_SECONDS
        value: "90"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_TIMEOUT_SECONDS
        value: "90"
